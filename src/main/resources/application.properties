spring.application.name=mycoolapp

# Proprietes custom injectees avec @Value
coach.name=Mickey Mouse
team.name=The Mouse Club

server.port=8080

# Exposer tous les endpoints Actuator (health, info, beans, env, metrics...)
management.endpoints.web.exposure.include=*

# Alimenter /actuator/info avec les proprietes info.*
management.info.env.enabled=true
info.app.name=My Super Cool App
info.app.description=A crazy fun app, yoohoo!
info.app.version=1.0.0

# Fichier surveille par le HealthIndicator custom
app.health.file=data/team.txt

# Detail des composants de sante visible par les utilisateurs authentifies
management.endpoint.health.show-details=when-authorized

# Identifiants HTTP Basic
